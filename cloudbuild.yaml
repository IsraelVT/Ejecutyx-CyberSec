steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ejecutyx-cyber-api:$COMMIT_SHA", "services/api"]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ejecutyx-cyber-api:$COMMIT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "deploy", "ejecutyx-cyber-api", "--image", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ejecutyx-cyber-api:$COMMIT_SHA", "--region", "${_REGION}", "--platform", "managed", "--quiet"]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/ejecutyx-cyber-api:$COMMIT_SHA"
substitutions:
  _REGION: us-central1
  _REPOSITORY: ejecutyx-cyber
